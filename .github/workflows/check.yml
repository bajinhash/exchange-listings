name: Daily data check

# Runs at 22:11 Asia/Shanghai (14:11 UTC) — after the 18:07/18:23/21:17 CST
# scrape crons and the 18:00/18:30 Mac launchd runs have all had their shot.
# If today's data file is missing or empty, this opens a GitHub Issue and
# triggers a recovery scrape. Acts as a safety net since GH Actions
# schedules occasionally skip runs entirely.
#
# HISTORY: this file shipped with a YAML parse error (a heredoc body at
# column 0 terminated the `run: |` block scalar), so it NEVER parsed and
# the schedule never fired — the safety net was dead from day one, and
# every credentialed push spawned a stub "failure" run for the broken
# file. Keep ALL lines inside run blocks indented; no column-0 heredocs.
on:
  schedule:
    # Odd minute on purpose — :00/:30 are GH's congestion peaks where
    # scheduled runs get delayed or dropped (same reason scrape.yml fires
    # at :07/:23/:17/:43).
    - cron: '11 14 * * *'   # 22:11 CST
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify today's data file
        id: verify
        run: |
          DATE=$(TZ=Asia/Shanghai date +%F)
          FILE="data/${DATE}.json"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

          if [ ! -f "$FILE" ]; then
            echo "::error::${FILE} does not exist"
            echo "status=missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Sum listings + alpha + wallet across all exchanges
          COUNT=$(jq '[
            .exchanges[]
            | ((.listings // []) | length)
              + ((.alpha    // []) | length)
              + ((.wallet   // []) | length)
          ] | add // 0' "$FILE")
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -lt 1 ]; then
            echo "::error::${FILE} has 0 listings — formatter or scraper failed"
            echo "status=empty" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "::notice::${FILE} OK — ${COUNT} listings"
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Open issue + trigger recovery scrape on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.verify.outputs.date }}"
          FILE="${{ steps.verify.outputs.file }}"
          STATUS="${{ steps.verify.outputs.status }}"
          COUNT="${{ steps.verify.outputs.count }}"

          # Trigger a fresh scrape run
          gh workflow run scrape.yml --ref main

          # Open a GitHub issue (deduped per day). Body built with printf —
          # a heredoc's column-0 body would terminate this YAML block scalar
          # and break the whole workflow file (it did, for three weeks).
          TITLE="[data check] ${DATE}: ${STATUS}"
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            BODY=$(printf '**Daily data check failed at %s.**\n\n- File: `%s`\n- Status: `%s`\n- Count: `%s`\n\nA recovery scrape has been triggered automatically. Check the latest run under [Actions → Daily scrape + format](https://github.com/%s/actions/workflows/scrape.yml).\n\nIf this triggers repeatedly, the scraper / formatter likely needs investigation.\n' \
              "$(TZ=Asia/Shanghai date '+%F %H:%M %Z')" "$FILE" "$STATUS" "$COUNT" "${{ github.repository }}")
            gh issue create --title "$TITLE" --body "$BODY"
          else
            echo "issue #${EXISTING} already open for today, skipping create"
          fi
