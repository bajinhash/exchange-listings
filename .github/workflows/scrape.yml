name: Daily scrape + format

# GitHub Actions scheduled runs are best-effort: they fire 1-3h late under
# load (observed 2026-06-09: all four crons fired, each ~2-3h delayed) and
# at :00/:30 congestion peaks they get dropped outright. Mitigations:
#   1. Fire at odd minutes, OFF :00/:30, to dodge the worst congestion.
#   2. Four spread fire times so at least one usually lands near 18:00.
#   3. ALL crons sit ≤ 21:00 CST: with a worst-case ~3h delay the run still
#      executes before CST midnight. On 6/9 the 21:17/23:43 crons slid past
#      midnight and wrote the NEXT day's file — useless as same-day backstops.
# The Mac launchd bot-clone backup (18:00/18:30 CST) is the on-time
# guarantee; these are the cloud fallback. Runs are idempotent.
# Window: yesterday 18:00 CST → today 18:00 CST (24h rolling).
on:
  schedule:
    - cron: '7 10 * * *'    # 18:07 CST primary
    - cron: '23 10 * * *'   # 18:23 CST backup
    - cron: '47 11 * * *'   # 19:47 CST late catch
    - cron: '53 12 * * *'   # 20:53 CST last resort (+3h delay → 23:53, still same CST day)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Map secret to job-level env so step-level `if:` can branch on it.
    # (secrets.* cannot be referenced directly inside `if:` — that fails workflow parsing.)
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install xvfb (virtual display for the non-headless fallback)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      # xvfb-run gives headless:false a display. Gate.io's Akamai hard-403s
      # headless Chromium from data-center IPs (started ~2026-06-09; the
      # fallback then failed here with "browserType.launch: ...closed" for
      # lack of a display and wrote gateio=[]). Under xvfb the real-browser
      # fallback can at least attempt the Akamai sensor check; if Akamai
      # still blocks this runner's IP, the merge-don't-clobber save keeps
      # earlier good data (e.g. from the Mac runner) instead of clobbering.
      - name: Run scraper (raw → data/raw-DATE.json)
        run: xvfb-run --auto-servernum npm run scrape

      - name: AI format (Claude Opus 4.7, if ANTHROPIC_API_KEY set)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run format
        continue-on-error: true

      - name: Basic rule-based format (fallback when no API key)
        if: env.ANTHROPIC_API_KEY == ''
        run: npm run basic-format
        continue-on-error: true

      - name: Weekly recap (last 7 daily JSONs → data/weekly.json)
        run: npm run weekly
        continue-on-error: true

      - name: Commit outputs if changed
        run: |
          # Use CST date — scraper / formatter compute filenames from
          # Asia/Shanghai date, so 'date -u +%F' would mismatch in the
          # 16:00-23:59 UTC window (= 00:00-07:59 CST next day).
          DATE=$(TZ=Asia/Shanghai date +%F)
          RAW="data/raw-${DATE}.json"
          FORMATTED="data/${DATE}.json"
          WEEKLY="data/weekly.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ADDED=0
          [ -f "$RAW" ]       && git add "$RAW"       && ADDED=1
          [ -f "$FORMATTED" ] && git add "$FORMATTED" && ADDED=1
          [ -f "$WEEKLY" ]    && git add "$WEEKLY"    && ADDED=1

          if [ $ADDED -eq 1 ] && ! git diff --cached --quiet; then
            git commit -m "data: scrape + format + weekly ${DATE}"
            # Race-safe push using soft-reset strategy: if remote moved while
            # we ran, fetch latest, soft-reset to it (keeps our changes
            # staged), recommit on top. Avoids rebase-conflict failures
            # since data/*.json are auto-generated and idempotent.
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push attempt $attempt failed; resetting onto latest remote main"
              git fetch origin main || exit 1
              # IMPORTANT: use --mixed (not --soft). Soft keeps the index from
              # the workflow's prior commit, which was based on the older
              # checkout. After `git add data/` + commit, the resulting tree
              # silently REVERTS any non-data file that landed on origin/main
              # since checkout (e.g. a scraper.js or scripts/ change pushed by
              # a separate cron run or by local-cron). Mixed resets the index
              # to origin/main, so the commit contains ONLY our data/ changes
              # on top of whatever the latest main has.
              git reset --mixed origin/main || exit 1
              git add data/
              if ! git diff --cached --quiet; then
                git commit -m "data: scrape + format + weekly ${DATE}"
              else
                echo "no diff vs remote — remote already has these data files"
                break
              fi
            done
          else
            echo "no changes to commit"
          fi

      - name: Upload raw artifact for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw-*.json
          retention-days: 14
          if-no-files-found: ignore
