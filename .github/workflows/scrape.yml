name: Daily scrape + format

# Runs every day at 10:00 UTC = 18:00 Asia/Shanghai (evening briefing).
# Window covered: yesterday 18:00 CST → today 18:00 CST (24h rolling).
# Also exposed as a manual trigger from the Actions tab.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Map secret to job-level env so step-level `if:` can branch on it.
    # (secrets.* cannot be referenced directly inside `if:` — that fails workflow parsing.)
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run scraper (raw → data/raw-DATE.json)
        run: npm run scrape

      - name: AI format (Claude Opus 4.7, if ANTHROPIC_API_KEY set)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run format
        continue-on-error: true

      - name: Basic rule-based format (fallback when no API key)
        if: env.ANTHROPIC_API_KEY == ''
        run: npm run basic-format
        continue-on-error: true

      - name: Weekly recap (last 7 daily JSONs → data/weekly.json)
        run: npm run weekly
        continue-on-error: true

      - name: Commit outputs if changed
        run: |
          DATE=$(date -u +%F)
          RAW="data/raw-${DATE}.json"
          FORMATTED="data/${DATE}.json"
          WEEKLY="data/weekly.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ADDED=0
          [ -f "$RAW" ]       && git add "$RAW"       && ADDED=1
          [ -f "$FORMATTED" ] && git add "$FORMATTED" && ADDED=1
          [ -f "$WEEKLY" ]    && git add "$WEEKLY"    && ADDED=1

          if [ $ADDED -eq 1 ] && ! git diff --cached --quiet; then
            git commit -m "data: scrape + format + weekly ${DATE}"
            # Race-safe push: another commit may have landed while we ran (~5 min)
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push attempt $attempt failed; rebasing onto remote main"
              git pull --rebase origin main || { echo "rebase failed"; exit 1; }
            done
          else
            echo "no changes to commit"
          fi

      - name: Upload raw artifact for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw-*.json
          retention-days: 14
          if-no-files-found: ignore
